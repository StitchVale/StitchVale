<!DOCTYPE html>
<html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carica Prodotto — StitchVale</title>

  <style>
    :root {
      --bg-color: #050505;
      --card-bg: #0d0d0d;
      --input-bg: #141414;
      --accent-color: #ffffff;
      --text-main: #ffffff;
      --text-muted: #666666;
      --border-color: #1a1a1a;
      --focus-border: #333333;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(5, 5, 5, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo img {
      height: 45px;
      filter: grayscale(1) brightness(1.2);
    }

    .wrapper {
      max-width: 650px;
      margin: 60px auto;
      padding: 0 25px;
    }

    .header-title {
      margin-bottom: 40px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .header-title h1 {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 8px 0;
    }

    .header-title p {
      color: var(--text-muted);
      font-size: 16px;
      margin: 0;
    }

    .btn-back {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s;
    }

    .btn-back:hover {
      color: var(--text-main);
      border-color: #444;
    }

    /* Box del Form */
    .form-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 35px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    input[type="text"], 
    input[type="number"], 
    select, 
    textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 14px;
      border-radius: 10px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--focus-border);
    }

    textarea {
      height: 100px;
      resize: none;
    }

    /* Stile personalizzato per l'upload dei file */
    .file-input-wrapper {
      position: relative;
      background: var(--input-bg);
      border: 1px dashed var(--border-color);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .file-input-wrapper:hover {
      border-color: #444;
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .file-input-text {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Bottone Pubblica */
    .btn-submit {
      width: 100%;
      background: var(--accent-color);
      color: #000000;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full-width { grid-column: span 1; }
      .header-title { flex-direction: column; gap: 15px; }
    }
  </style>

  
</head>
<body>
  <header>
  <div class="logo">
    <a href="home.html"><img src="logo3.jpg" alt="StitchVale"></a>
  </div>
</header>

<div class="wrapper">
  
  <div class="header-title">
    <div>
      <h1>Nuovo Capo</h1>
      <p>Inserisci i dettagli del prodotto per pubblicarlo nel catalogo di StitchVale.</p>
    </div>
    <a href="dashboard-brand.html" class="btn-back">← Torna all'Area Brand</a>
  </div>

  <div class="form-box">
    <form id="productForm" onsubmit="publishProduct(event)">
      
      <div class="form-grid">
        
        <div class="form-group">
          <label for="prodName">Nome Prodotto</label>
          <input type="text" id="prodName" placeholder="Es: Felpa Oversize Heavyweight" required>
        </div>

        <div class="form-group">
          <label for="prodBrand">Seleziona il tuo Brand</label>
          <input type="text" id="prodBrand" placeholder="Es: StitchVale Studio" required>
        </div>

        <div class="form-group">
          <label for="prodPrice">Prezzo (€)</label>
          <input type="number" id="prodPrice" step="0.01" placeholder="Es: 65.00" required>
        </div>

        <div class="form-group">
          <label for="prodCategory">Categoria</label>
          <select id="prodCategory">
            <option value="felpe">Felpe / Hoodie</option>
            <option value="tshirt">T-Shirt / Magliette</option>
            <option value="pantaloni">Pantaloni / Cargo</option>
            <option value="accessori">Accessori</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label for="prodDescription">Descrizione del Prodotto</label>
          <textarea id="prodDescription" placeholder="Dettagli sul fit, composizione del tessuto (es. 100% cotone 400gsm), dettagli sulla stampa o ricamo..."></textarea>
        </div>

        <div class="form-group full-width">
          <label>Immagine Prodotto</label>
          <div class="file-input-wrapper">
            <span id="fileLabel" class="file-input-text">Trascina qui la foto del capo o clicca per cercarla</span>
            <input type="file" id="prodImage" accept="image/*" onchange="updateFileName()" required>
          </div>
        </div>

      </div>

      <button type="submit" id="btnSubmit" class="btn-submit">Pubblica nel Drop</button>

    </form>
  </div>

</div>

  <script>
    const API_URL = "https://stitchvale-api.onrender.com";

  // Cambia il testo del box di upload quando viene scelta una foto
  function updateFileName() {
    const input = document.getElementById("prodImage");
    const label = document.getElementById("fileLabel");
    if (input.files.length > 0) {
      label.innerText = `File selezionato: ${input.files[0].name}`;
      label.style.color = "#ffffff";
    }
  }

  // Funzione per inviare il prodotto al server (Render + Supabase)
  async function publishProduct(event) {
    event.preventDefault();
    const btn = document.getElementById("btnSubmit");

    const name = document.getElementById("prodName").value;
    const brand = document.getElementById("prodBrand").value;
    const price = document.getElementById("prodPrice").value;
    const category = document.getElementById("prodCategory").value;
    const description = document.getElementById("prodDescription").value;
    const imageFile = document.getElementById("prodImage").files[0];

    // Effetto loading sul pulsante
    btn.innerText = "Pubblicazione in corso...";
    btn.disabled = true;
    btn.style.opacity = "0.7";

    // Usiamo FormData perché dobbiamo inviare un file fisico (l'immagine)
    const formData = new FormData();
    formData.append("name", name);
    formData.append("brand", brand);
    formData.append("price", price);
    formData.append("category", category);
    formData.append("description", description);
    formData.append("image", imageFile);

    try {
      const res = await fetch(API_URL + "/products", {
        method: "POST",
        // Nota: Con FormData non bisogna impostare l'header "Content-Type", ci pensa il browser automaticamente
        body: formData
      });

      if (res.ok) {
        alert(`Grandioso! "${name}" è stato aggiunto con successo al catalogo.`);
        document.getElementById("productForm").reset();
        document.getElementById("fileLabel").innerText = "Trascina qui la foto del capo o clicca per cercarla";
        document.getElementById("fileLabel").style.color = "var(--text-muted)";
      } else {
        const errorData = await res.json();
        alert("Errore durante la pubblicazione: " + (errorData.message || "Risposta negativa dal server."));
      }
    } catch (err) {
      console.error(err);
      alert("Impossibile connettersi al server Render. Verifica la connessione.");
    } finally {
      // Ripristina il pulsante originale
      btn.innerText = "Pubblica nel Drop";
      btn.disabled = false;
      btn.style.opacity = "1";
    }
  }
  </script>
</body>
</html>
