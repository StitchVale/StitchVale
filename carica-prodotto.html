<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carica Prodotto — StitchVale</title>

  <style>
    :root {
      --bg-color: #050505;
      --card-bg: #0d0d0d;
      --input-bg: #141414;
      --accent-color: #ffffff;
      --text-main: #ffffff;
      --text-muted: #666666;
      --border-color: #1a1a1a;
      --focus-border: #333333;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(5, 5, 5, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo img {
      height: 45px;
      filter: grayscale(1) brightness(1.2);
    }

    .wrapper {
      max-width: 850px;
      margin: 60px auto;
      padding: 0 25px;
    }

    .header-title {
      margin-bottom: 40px;
    }

    .header-title h1 {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 8px 0;
    }

    .header-title p {
      color: var(--text-muted);
      font-size: 16px;
      margin: 0;
    }

    .section-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 35px;
      margin-bottom: 30px;
    }

    .section-box h2 {
      font-size: 18px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 0 0 25px 0;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    input[type="text"], 
    input[type="number"], 
    input[type="file"],
    select, 
    textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 14px;
      border-radius: 10px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="file"] {
      padding: 10px;
      cursor: pointer;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--focus-border);
    }

    textarea {
      height: 120px;
      resize: none;
    }

    /* Griglia Anteprime Immagini */
    .preview-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .preview-item {
      position: relative;
      width: 100%;
      padding-top: 100%; /* Mantiene il formato 1:1 */
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .preview-item img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-save {
      background: var(--accent-color);
      color: #000000;
      border: none;
      padding: 15px 35px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-save:hover {
      opacity: 0.9;
    }

    .navigation-zone {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .btn-back {
      display: inline-block;
      background: transparent;
      color: var(--text-muted);
      padding: 10px 20px;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }

    .btn-back:hover {
      color: var(--text-main);
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full-width { grid-column: span 1; }
      header { padding: 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <a href="home.html"><img src="logo3.jpg" alt="StitchVale"></a>
  </div>
</header>

<div class="wrapper" id="mainContent" style="display: none;">
  
  <div class="header-title">
    <h1>Nuovo Drop / Prodotto</h1>
    <p>Aggiungi un nuovo capo d'abbigliamento o accessorio al catalogo del tuo brand su StitchVale.</p>
  </div>

  <form id="productForm" onsubmit="handleProductSubmit(event)">
    
    <div class="section-box">
      <h2>1. Dettagli Prodotto</h2>
      <div class="form-grid">
        <div class="form-group">
          <label for="productName">Nome del Capo</label>
          <input type="text" id="productName" placeholder="Es: Hoodie Oversize 'STITCH'" required>
        </div>
        
        <div class="form-group">
          <label for="productCategory">Categoria</label>
          <select id="productCategory">
            <option value="T-Shirt">T-Shirt</option>
            <option value="Felpe / Hoodie">Felpe / Hoodie</option>
            <option value="Pantaloni / Denim">Pantaloni / Denim</option>
            <option value="Giacche / Outerwear">Giacche / Outerwear</option>
            <option value="Accessori">Accessori</option>
          </select>
        </div>

        <div class="form-group">
          <label for="productPrice">Prezzo (€)</label>
          <input type="number" id="productPrice" placeholder="Es: 75" step="0.01" required>
        </div>

        <div class="form-group full-width">
          <label for="productDescription">Descrizione, Vestibilità & Materiali</label>
          <textarea id="productDescription" placeholder="Specifica i grammi del cotone (es. 400 GSM), il tipo di ricamo o stampa e i dettagli della vestibilità (Boxy, Raglan, Oversize)..." required></textarea>
        </div>
      </div>
    </div>

    <div class="section-box">
      <h2>2. Media & Lookbook</h2>
      <div class="form-group full-width">
        <label for="productImages">Immagini del Prodotto (Seleziona una o più foto)</label>
        <input type="file" id="productImages" accept="image/*" multiple required onchange="previewFiles()">
        <small style="color: var(--text-muted); margin-top: 6px; display: block;">
          Puoi caricare fino a 8 foto contemporaneamente. Tieni premuto Ctrl (Windows) o Cmd (Mac) per selezionarle insieme.
        </small>
        
        <div class="preview-container" id="imagePreviewZone"></div>
      </div>
    </div>

    <div style="text-align: right; margin-bottom: 40px;">
      <button type="submit" id="saveProductBtn" class="btn-save">Pubblica Prodotto nel Catalogo</button>
    </div>

  </form>

  <div class="navigation-zone">
    <a href="brand.html" class="btn-back">← Torna al Profilo Brand</a>
  </div>

</div>

<script>
  const API_URL = "https://stitchvale-api.onrender.com";

  window.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    if (!token || role !== "brand") {
      alert("ACCESSO NEGATO: Questa sezione è abilitata solo per i Brand registrati.");
      window.location.href = "account.html";
    } else {
      document.getElementById("mainContent").style.display = "block";
    }
  });

  // Funzione per generare l'anteprima visiva immediata sul browser delle foto selezionate
  function previewFiles() {
    const previewZone = document.getElementById("imagePreviewZone");
    const files = document.getElementById("productImages").files;
    
    previewZone.innerHTML = ""; // Svuota anteprime precedenti

    if (files) {
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const div = document.createElement("div");
          div.className = "preview-item";
          div.innerHTML = `<img src="${e.target.result}" alt="Anteprima">`;
          previewZone.appendChild(div);
        }
        reader.readAsDataURL(file);
      });
    }
  }

  // Invio dei dati e dell'array di file multimediali al Backend Render
  async function handleProductSubmit(event) {
    event.preventDefault();
    const btn = document.getElementById("saveProductBtn");
    const token = localStorage.getItem("token");
    
    btn.innerText = "Caricamento Drop...";
    btn.disabled = true;

    const formData = new FormData();
    formData.append("name", document.getElementById("productName").value);
    formData.append("category", document.getElementById("productCategory").value);
    formData.append("description", document.getElementById("productDescription").value);
    formData.append("price", document.getElementById("productPrice").value);

    // Gestione dell'invio Multi-File
    const fileInput = document.getElementById("productImages");
    if (fileInput.files.length > 0) {
      for (let i = 0; i < fileInput.files.length; i++) {
        // Appende ogni singolo file dentro il pacchetto multimediale chiamato "images"
        formData.append("images", fileInput.files[i]);
      }
    }

    try {
      const res = await fetch(API_URL + "/products", {
        method: "POST",
        headers: { 
          "Authorization": "Bearer " + token 
        },
        body: formData
      });

      const data = await res.json();

      if (res.ok) {
        alert("Successo! Il capo è stato pubblicato con tutte le immagini associate.");
        document.getElementById("productForm").reset();
        document.getElementById("imagePreviewZone").innerHTML = ""; // Svuota le miniature
      } else {
        alert("Errore: " + (data.message || "Impossibile caricare il prodotto."));
      }
    } catch (err) {
      console.error(err);
      alert("Errore di connessione di rete con il server Render.");
    } finally {
      btn.innerText = "Pubblica Prodotto nel Catalogo";
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
