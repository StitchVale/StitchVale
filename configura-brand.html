<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurazione Brand — StitchVale</title>

  <style>
    :root {
      --bg-color: #050505;
      --card-bg: #0d0d0d;
      --input-bg: #141414;
      --accent-color: #ffffff;
      --text-main: #ffffff;
      --text-muted: #666666;
      --border-color: #1a1a1a;
      --focus-border: #333333;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(5, 5, 5, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo img {
      height: 45px;
      filter: grayscale(1) brightness(1.2);
    }

    .wrapper {
      max-width: 850px;
      margin: 60px auto;
      padding: 0 25px;
    }

    .header-title {
      margin-bottom: 40px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .header-title h1 {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 8px 0;
    }

    .header-title p {
      color: var(--text-muted);
      font-size: 16px;
      margin: 0;
    }

    .btn-back {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      transition: background 0.2s;
    }

    .btn-back:hover {
      background: #111111;
    }

    .section-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 35px;
      margin-bottom: 30px;
    }

    .section-box h2 {
      font-size: 18px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 0 0 25px 0;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    input[type="text"], 
    input[type="url"], 
    input[type="file"],
    select, 
    textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 14px;
      border-radius: 10px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="file"] {
      padding: 10px;
      cursor: pointer;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--focus-border);
    }

    textarea {
      height: 100px;
      resize: none;
    }

    .btn-save {
      background: var(--accent-color);
      color: #000000;
      border: none;
      padding: 15px 35px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-save:hover {
      opacity: 0.9;
    }

    .navigation-zone {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .navigation-zone p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .btn-next-step {
      display: inline-block;
      background: transparent;
      color: var(--text-main);
      border: 1px solid #262626;
      padding: 16px 40px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .btn-next-step:hover {
      background: var(--accent-color);
      color: #000000;
      border-color: var(--accent-color);
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full-width { grid-column: span 1; }
      header { padding: 20px; }
      .header-title { flex-direction: column; align-items: flex-start; gap: 15px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <a href="home.html"><img src="logo3.jpg" alt="StitchVale"></a>
  </div>
</header>

<div class="wrapper" id="mainContent" style="display: none;">
  
  <div class="header-title">
    <div>
      <h1>Identity Brand</h1>
      <p>Personalizza l'estetica, i dettagli e la presentazione del tuo marchio su StitchVale.</p>
    </div>
    <a href="brand.html" class="btn-back">← Torna alla Dashboard</a>
  </div>

  <form id="brandIdentityForm" onsubmit="handleFormSubmit(event)">
    
    <div class="section-box">
      <h2>1. Informazioni Generali</h2>
      <div class="form-grid">
        <div class="form-group">
          <label for="brandName">Nome Brand</label>
          <input type="text" id="brandName" placeholder="Es: StitchVale Studio" required>
        </div>
        <div class="form-group">
          <label for="brandSlogan">Slogan / Payoff Breve</label>
          <input type="text" id="brandSlogan" placeholder="Es: Luxury Streetwear Core">
        </div>
        <div class="form-group">
          <label for="brandSlug">Custom Link / Slug URL</label>
          <input type="text" id="brandSlug" placeholder="Es: stitchvale-studio (senza spazi)">
        </div>
        <div class="form-group">
          <label for="brandLocation">Città / Sede Operativa</label>
          <input type="text" id="brandLocation" placeholder="Es: Milano, Italia">
        </div>
        <div class="form-group full-width">
          <label for="brandBio">Biografia / Storia del Marchio</label>
          <textarea id="brandBio" placeholder="Descrivi la visione del tuo brand, le ispirazioni dei tuoi drop e la filosofia dei tessuti..."></textarea>
        </div>
      </div>
    </div>

    <div class="section-box">
      <h2>2. Visual & Estetica</h2>
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="brandLogo">Carica Logo Ufficiale (1:1)</label>
          <input type="file" id="brandLogo" accept="image/*">
          <small id="logoStatus" style="color: #666; margin-top: 5px;"></small>
        </div>
        <div class="form-group full-width">
          <label for="brandStyle">Stile Principale del Brand</label>
          <select id="brandStyle">
            <option value="streetwear">Streetwear / Oversize</option>
            <option value="minimal">Minimal / Essential</option>
            <option value="vintage">Y2K / Vintage Retro</option>
            <option value="luxury">Luxury / High-End</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section-box">
      <h2>3. Canali Social & Contatti</h2>
      <div class="form-grid">
        <div class="form-group">
          <label for="brandInstagram">Username Instagram</label>
          <input type="text" id="brandInstagram" placeholder="Es: @stitchvale">
        </div>
        <div class="form-group">
          <label for="brandTikTok">Username TikTok</label>
          <input type="text" id="brandTikTok" placeholder="Es: @stitchvale_studio">
        </div>
        <div class="form-group full-width">
          <label for="brandWebsite">Sito Web Esterno (Opzionale)</label>
          <input type="url" id="brandWebsite" placeholder="https://www.tuosito.com">
        </div>
      </div>
    </div>

    <div style="text-align: right; margin-bottom: 40px;">
      <button type="submit" id="saveBtn" class="btn-save">Salva Configurazione Brand</button>
    </div>

  </form>

  <div class="navigation-zone">
    <p>Vuoi tornare a controllare i tuoi prodotti o caricarne uno nuovo?</p>
    <a href="brand.html" class="btn-next-step">Vai alla gestione prodotti →</a>
  </div>

</div>

<script>
  const API_URL = "https://stitchvale-api.onrender.com";

  window.addEventListener('DOMContentLoaded', async () => {
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    if (!token || role !== "brand") {
      alert("ACCESSO NEGATO: Sezione riservata esclusivamente ai Brand.");
      window.location.href = "account.html";
    } else {
      document.getElementById("mainContent").style.display = "block";
      await loadBrandData();
    }
  });

  async function loadBrandData() {
    const token = localStorage.getItem("token");
    try {
      const res = await fetch(API_URL + "/brands", {
        method: "GET",
        headers: { "Authorization": "Bearer " + token }
      });
      
      if (res.ok) {
        const brandsList = await res.json();
        if (brandsList && brandsList.length > 0) {
          const b = brandsList[0]; 
          
          if (b.name) document.getElementById("brandName").value = b.name;
          if (b.slogan) document.getElementById("brandSlogan").value = b.slogan;
          if (b.slug) document.getElementById("brandSlug").value = b.slug;
          if (b.location) document.getElementById("brandLocation").value = b.location;
          if (b.bio) document.getElementById("brandBio").value = b.bio;
          if (b.style) document.getElementById("brandStyle").value = b.style;
          if (b.instagram) document.getElementById("brandInstagram").value = b.instagram;
          if (b.tiktok) document.getElementById("brandTikTok").value = b.tiktok;
          if (b.website) document.getElementById("brandWebsite").value = b.website;
          
          if (b.logo) {
            document.getElementById("logoStatus").innerText = "Logo attuale: " + b.logo;
          }
        }
      }
    } catch (err) {
      console.error("Errore recupero informazioni brand:", err);
    }
  }

  async function handleFormSubmit(event) {
    event.preventDefault();
    const btn = document.getElementById("saveBtn");
    const token = localStorage.getItem("token");
    
    btn.innerText = "Salvataggio...";
    btn.disabled = true;

    const formData = new FormData();
    formData.append("name", document.getElementById("brandName").value);
    formData.append("slogan", document.getElementById("brandSlogan").value || "");
    formData.append("slug", document.getElementById("brandSlug").value || "");
    formData.append("location", document.getElementById("brandLocation").value || "");
    formData.append("bio", document.getElementById("brandBio").value || "");
    formData.append("style", document.getElementById("brandStyle").value);
    formData.append("instagram", document.getElementById("brandInstagram").value || "");
    formData.append("tiktok", document.getElementById("brandTikTok").value || "");
    formData.append("website", document.getElementById("brandWebsite").value || "");

    const logoInput = document.getElementById("brandLogo");
    if (logoInput.files.length > 0) {
      formData.append("logo", logoInput.files[0]);
    }

    try {
      const res = await fetch(API_URL + "/brands", {
        method: "POST",
        headers: { "Authorization": "Bearer " + token },
        body: formData
      });

      const data = await res.json();

      if (res.ok) {
        alert("Profilo Brand salvato con successo!");
        await loadBrandData();
      } else {
        alert("Errore: " + (data.message || "Impossibile salvare i dati."));
      }
    } catch (err) {
      console.error(err);
      alert("Errore di rete durante il salvataggio.");
    } finally {
      btn.innerText = "Salva Configurazione Brand";
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
