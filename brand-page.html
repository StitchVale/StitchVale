<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand - StitchVale</title>

  <style>
    :root {
      --bg-dark: #0a0a0a;
      --bg-card: #121212;
      --border-color: #222222;
      --text-muted: #888888;
      --accent-color: #ffffff;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-dark);
      color: white;
      -webkit-font-smoothing: antialiased;
    }

    /* --- NAV BAR --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo img {
      height: 50px;
      transition: transform 0.3s ease;
    }

    .logo img:hover {
      transform: scale(1.05);
    }

    nav a {
      color: var(--text-muted);
      margin-left: 25px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: var(--accent-color);
    }

    /* --- BRAND HERO (STREETWEAR LOOK) --- */
    .brand-hero {
      position: relative;
      text-align: center;
      padding: 100px 20px;
      background: radial-gradient(circle at top, #1c1c1c 0%, #0a0a0a 100%);
      border-bottom: 1px solid var(--border-color);
      overflow: hidden;
    }

    .brand-hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, transparent, rgba(10, 10, 10, 0.9));
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 800px;
      margin: 0 auto;
    }

    .brand-logo {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      background: #151515;
      margin-bottom: 25px;
      border: 2px solid var(--accent-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .brand-logo:hover {
      transform: scale(1.08) rotate(3deg);
    }

    .brand-hero h1 {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -1px;
      margin: 10px 0;
      text-transform: uppercase;
    }

    .brand-hero p {
      color: #b3b3b3;
      font-size: 16px;
      max-width: 600px;
      margin: 20px auto;
      line-height: 1.6;
    }

    .brand-style-badge {
      display: inline-block;
      background: var(--accent-color);
      color: black;
      padding: 6px 18px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 15px;
    }

    /* --- SOCIAL & STATS --- */
    .brand-meta {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 25px;
    }

    .meta-item {
      font-size: 13px;
      color: var(--text-muted);
    }

    .meta-item strong {
      color: white;
    }

    /* --- PRODUCT GRID --- */
    .section {
      padding: 60px 40px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .section h2 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 40px;
      text-transform: uppercase;
      position: relative;
    }

    .section h2::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 40px;
      height: 2px;
      background: var(--accent-color);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
    }

    /* --- PREMIUM PRODUCT CARD --- */
    .card {
      background: var(--bg-card);
      border-radius: 0px; /* Angoli vivi, molto più streetwear/cyberpunk */
      overflow: hidden;
      border: 1px solid var(--border-color);
      transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), border-color 0.4s ease, box-shadow 0.4s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: #444;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
    }

    .image-container {
      width: 100%;
      height: 340px;
      overflow: hidden;
      background: #181818;
      position: relative;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    .card:hover img {
      transform: scale(1.05);
    }

    .card-info {
      padding: 20px;
      background: linear-gradient(to bottom, #121212, #0f0f0f);
    }

    .category-tag {
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .card-info h3 {
      margin: 5px 0 10px 0;
      font-size: 18px;
      font-weight: 600;
    }

    .card-info h3 a {
      color: white;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .card-info h3 a:hover {
      color: var(--text-muted);
    }

    .description {
      color: #777;
      font-size: 13px;
      line-height: 1.5;
      margin: 10px 0 20px 0;
      height: 38px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #1a1a1a;
      padding-top: 15px;
    }

    .price {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .view-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: white;
      padding: 8px 14px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    .card:hover .view-btn {
      border-color: white;
      background: white;
      color: black;
    }

    /* --- EMPTY STATE --- */
    .no-products {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      border: 1px dashed var(--border-color);
    }

    /* --- FOOTER --- */
    footer {
      padding: 50px 40px;
      text-align: center;
      border-top: 1px solid var(--border-color);
      background: #050505;
      color: var(--text-muted);
      font-size: 14px;
    }

    footer h3 {
      color: white;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    footer p {
      margin: 5px 0;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header { padding: 20px; }
      nav { display: none; } /* Puoi implementare un menu mobile in futuro */
      .brand-hero h1 { font-size: 38px; }
      .section { padding: 40px 20px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <a href="home.html">
        <img src="logo3.jpg" alt="StitchVale Logo">
      </a>
    </div>

    <nav>
      <a href="novita.html">Novità</a>
      <a href="brand.html">Brand</a>
      <a href="account.html">Account</a>
      <a href="catalogo.html">Catalogo</a>
      <a href="idee.html">Idee</a>
      <a href="outfit.html">AI Outfit</a>
    </nav>
  </header>

  <section class="brand-hero" id="brandHero">
    <div class="hero-content">
      <p>Caricamento profilo brand...</p>
    </div>
  </section>

  <section class="section">
    <h2>Collezione Esclusiva</h2>
    <div id="brandProducts" class="grid"></div>
  </section>

  <footer>
    <h3>StitchVale</h3>
    <p>Email: stitchvale1@gmail.com</p>
    <p>Instagram: @stitchvale</p>
  </footer>

  <script>
    const API_URL = "https://stitchvale-api.onrender.com";

    function getBrandEmail() {
      const params = new URLSearchParams(window.location.search);
      return params.get("email");
    }

    async function loadBrandPage() {
      const brandEmail = getBrandEmail();

      if (!brandEmail) {
        document.getElementById("brandHero").innerHTML = `
          <div class="hero-content">
            <h1>Brand non trovato</h1>
            <p>Torna al catalogo e seleziona un brand valido.</p>
          </div>
        `;
        return;
      }

      try {
        const [brandsRes, productsRes] = await Promise.all([
          fetch(API_URL + "/brands-list"),
          fetch(API_URL + "/products")
        ]);

        const brands = await brandsRes.json();
        const products = await productsRes.json();

        const brandProfile = brands.find(b => b.email.toLowerCase().trim() === brandEmail.toLowerCase().trim());
        const brandProducts = products.filter(p => p.brand.toLowerCase().trim() === brandEmail.toLowerCase().trim());

        if (brandProfile) {
          document.title = (brandProfile.name || "Brand") + " - StitchVale";
          
          document.getElementById("brandHero").innerHTML = `
            <div class="hero-content">
              ${brandProfile.style ? `<span class="brand-style-badge">${brandProfile.style}</span>` : ""}
              <div>
                ${brandProfile.logo ? `<img class="brand-logo" src="${API_URL}/uploads/${brandProfile.logo}" alt="${brandProfile.name}" onerror="this.style.display='none'">` : ""}
              </div>
              <h1>${brandProfile.name || "Brand Anonimo"}</h1>
              <p>${brandProfile.bio || "Nessuna descrizione disponibile per questo brand."}</p>
              
              <div class="brand-meta">
                <div class="meta-item">Drop totali: <strong>${brandProducts.length}</strong></div>
                ${brandProfile.instagram ? `<div class="meta-item">IG: <strong>${brandProfile.instagram}</strong></div>` : ""}
              </div>
            </div>
          `;
        } else {
          document.title = "Profilo Brand - StitchVale";
          document.getElementById("brandHero").innerHTML = `
            <div class="hero-content">
              <h1>Profilo in configurazione</h1>
              <p>L'utente (${brandEmail}) non ha ancora personalizzato i dettagli del suo brand.</p>
            </div>
          `;
        }

        const productsContainer = document.getElementById("brandProducts");
        
        if (brandProducts.length === 0) {
          productsContainer.innerHTML = `
            <div class="no-products">
              <h3>Nessun drop disponibile</h3>
              <p>Questo brand non ha ancora pubblicato articoli.</p>
            </div>`;
          return;
        }

        productsContainer.innerHTML = brandProducts.map(p => {
          const imageFile = p.image || (p.images && p.images[0]);
          
          return `
            <div class="card">
              <div class="image-container">
                ${imageFile ? `<img src="${API_URL}/uploads/${imageFile}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/400x340?text=No+Image'">` : ""}
              </div>
              <div class="card-info">
                <div class="category-tag">${p.category || "Streetwear"}</div>
                <h3>
                  <a href="prodotto.html?id=${p.id}">
                    ${p.name}
                  </a>
                </h3>
                <p class="description">${p.description || "Nessun dettaglio disponibile per questo capo."}</p>
                <div class="card-footer">
                  <span class="price">€${Number(p.price).toFixed(2)}</span>
                  <button class="view-btn" onclick="location.href='prodotto.html?id=${p.id}'">Vedi</button>
                </div>
              </div>
            </div>
          `;
        }).join("");

      } catch (error) {
        console.error("Errore nel caricamento della pagina brand:", error);
        document.getElementById("brandHero").innerHTML = `
          <div class="hero-content">
            <h1>Errore di caricamento</h1>
            <p>Impossibile connettersi al server per recuperare i dettagli.</p>
          </div>
        `;
      }
    }

    window.onload = loadBrandPage;
  </script>
</body>
</html>
