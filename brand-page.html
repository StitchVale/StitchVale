<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand - StitchVale</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px;
      background: black;
      border-bottom: 1px solid #222;
    }

    .logo img {
      height: 80px;
    }

    nav a {
      color: #aaa;
      margin-left: 20px;
      text-decoration: none;
    }

    nav a:hover {
      color: white;
    }

    .brand-hero {
      text-align: center;
      padding: 70px 20px;
      background: linear-gradient(135deg, #111, #1f1f1f, #000);
      border-bottom: 1px solid #222;
    }

    .brand-logo {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 50%;
      background: #222;
      margin-bottom: 20px;
      border: 1px solid #333;
    }

    .brand-hero h1 {
      font-size: 44px;
      margin: 10px 0;
    }

    .brand-hero p {
      color: #aaa;
      max-width: 700px;
      margin: 15px auto;
      line-height: 1.6;
    }

    .brand-style-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #fff;
      margin-bottom: 10px;
    }

    .section {
      padding: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 25px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #222;
    }

    .card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }

    .card-info {
      padding: 15px;
    }

    .card-info h3 a {
      color: white;
      text-decoration: none;
    }

    .description {
      color: #aaa;
      font-size: 14px;
      line-height: 1.4;
      margin: 8px 0;
    }

    .price {
      font-weight: bold;
    }

    footer {
      padding: 30px;
      text-align: center;
      border-top: 1px solid #222;
      color: #aaa;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <a href="home.html">
        <img src="logo3.jpg" alt="StitchVale Logo">
      </a>
    </div>

    <nav>
      <a href="novita.html">Novità</a>
      <a href="brand.html">Brand</a>
      <a href="account.html">Account</a>
      <a href="catalogo.html">Catalogo</a>
      <a href="idee.html">Idee</a>
      <a href="outfit.html">AI Outfit</a>
    </nav>
  </header>

  <section class="brand-hero" id="brandHero">
    <h1>Brand</h1>
    <p>Caricamento profilo brand...</p>
  </section>

  <section class="section">
    <h2>Prodotti del brand</h2>
    <div id="brandProducts" class="grid"></div>
  </section>

  <footer>
    <h3>StitchVale</h3>
    <p>Email: stitchvale1@gmail.com</p>
    <p>Instagram: @stitchvale</p>
  </footer>

  <script>
    const API_URL = "https://stitchvale-api.onrender.com";

    // Cattura l'email passata dall'URL (es: brand-page.html?email=joshua20@gmail.com)
    function getBrandEmail() {
      const params = new URLSearchParams(window.location.search);
      return params.get("email");
    }

    async function loadBrandPage() {
      const brandEmail = getBrandEmail();

      if (!brandEmail) {
        document.getElementById("brandHero").innerHTML = `
          <h1>Brand non trovato</h1>
          <p>Torna al catalogo e seleziona un brand valido.</p>
        `;
        return;
      }

      try {
        // 1. Scarica tutti i brand registrati
        const brandsRes = await fetch(API_URL + "/brands-list");
        const brands = await brandsRes.json();

        // 2. Scarica tutti i prodotti disponibili
        const productsRes = await fetch(API_URL + "/products");
        const products = await productsRes.json();

        // Cerca il profilo corrispondente all'email dell'URL
        const brandProfile = brands.find(b => b.email === brandEmail);

        // Filtra i prodotti inseriti da questo specifico brand
        const brandProducts = products.filter(p => p.brand === brandEmail);

        // Aggiorna le informazioni nell'Hero del Brand
        if (brandProfile) {
          document.title = (brandProfile.name || "Brand") + " - StitchVale";
          
          document.getElementById("brandHero").innerHTML = `
            ${brandProfile.style ? `<span class="brand-style-badge">${brandProfile.style}</span>` : ""}
            ${brandProfile.logo ? `<img class="brand-logo" src="${API_URL}/uploads/${brandProfile.logo}" alt="${brandProfile.name}" onerror="this.style.display='none'">` : ""}
            <h1>${brandProfile.name || "Brand Anonimo"}</h1>
            <p>${brandProfile.bio || "Nessuna descrizione disponibile per questo brand."}</p>
          `;
        } else {
          document.title = "Profilo Brand - StitchVale";
          document.getElementById("brandHero").innerHTML = `
            <h1>Profilo in configurazione</h1>
            <p>L'utente (${brandEmail}) non ha ancora configurato i dati del suo brand.</p>
          `;
        }

        // Mostra la griglia dei prodotti del Brand
        const productsContainer = document.getElementById("brandProducts");
        
        if (brandProducts.length === 0) {
          productsContainer.innerHTML = "<p>Al momento questo brand non ha articoli nella sua collezione.</p>";
          return;
        }

        productsContainer.innerHTML = brandProducts.map(p => {
          // Prendi la prima immagine disponibile
          const imageFile = p.image || (p.images && p.images[0]);
          
          return `
            <div class="card">
              ${imageFile ? `<img src="${API_URL}/uploads/${imageFile}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/400x260?text=No+Image'">` : ""}
              <div class="card-info">
                <h3>
                  <a href="prodotto.html?id=${p.id}">
                    ${p.name}
                  </a>
                </h3>
                <p style="color: #666; font-size: 13px; margin: 4px 0;">${p.category || ""}</p>
                <p class="description">${p.description || "Nessun dettaglio disponibile."}</p>
                <p class="price">€${Number(p.price).toFixed(2)}</p>
              </div>
            </div>
          `;
        }).join("");

      } catch (error) {
        console.error("Errore nel caricamento della pagina brand:", error);
        document.getElementById("brandHero").innerHTML = `
          <h1>Errore di caricamento</h1>
          <p>Impossibile connettersi al server. Riprova più tardi.</p>
        `;
      }
    }

    window.onload = loadBrandPage;
  </script>
</body>
</html>
