<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Outfit — StitchVale</title>

  <style>
    :root {
      --bg-color: #0a0a0a;
      --card-bg: #121212;
      --accent-color: #ffffff;
      --text-main: #ffffff;
      --text-muted: #707070;
      --border-color: #1a1a1a;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    /* Header Minimal */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo img {
      height: 50px;
      object-fit: contain;
      filter: grayscale(1) brightness(1.2);
    }

    nav a {
      color: var(--text-muted);
      margin-left: 25px;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--text-main);
    }

    /* Hero Section */
    .hero {
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
      padding: 80px 20px 40px 20px;
    }

    .hero h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 16px;
      max-width: 500px;
      margin: 0 auto 40px auto;
      line-height: 1.5;
    }

    /* Box Input AI Sottile */
    .ai-box {
      background: var(--card-bg);
      padding: 8px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    textarea {
      width: 100%;
      height: 90px;
      box-sizing: border-box;
      padding: 16px;
      border-radius: 12px;
      border: none;
      resize: none;
      font-family: inherit;
      font-size: 15px;
      background: transparent;
      color: var(--text-main);
      outline: none;
    }

    textarea::placeholder {
      color: #404040;
    }

    .ai-box-footer {
      display: flex;
      justify-content: flex-end;
      padding: 8px;
      border-top: 1px solid rgba(255,255,255,0.03);
    }

    .btn-generate {
      padding: 12px 28px;
      border-radius: 10px;
      border: none;
      background: var(--accent-color);
      color: #000000;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    .btn-generate:hover {
      opacity: 0.9;
    }

    .btn-generate:active {
      transform: scale(0.98);
    }

    #resultText {
      margin-top: 25px;
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    /* Sezione Risultati */
    .section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 40px 80px 40px;
    }

    .section h2 {
      font-size: 18px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 30px;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
    }

    /* Card Prodotto Estetica */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: border-color 0.3s ease, transform 0.3s ease;
    }

    .card:hover {
      border-color: #333333;
      transform: translateY(-4px);
    }

    .image-container {
      width: 100%;
      height: 340px;
      overflow: hidden;
      background: #161616;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .image-container img {
      transform: scale(1.03);
    }

    .card-info {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-info h3 {
      margin: 0 0 6px 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .brand-name {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .description {
      color: #8a8a8a;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.03);
    }

    .price {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .btn-cart {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #333333;
      background: transparent;
      color: var(--text-main);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .btn-cart:hover {
      background: var(--accent-color);
      color: #000000;
      border-color: var(--accent-color);
    }

    /* Footer Sottile */
    footer {
      padding: 60px 40px;
      text-align: center;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 13px;
    }

    footer h3 {
      color: var(--text-main);
      font-size: 16px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    footer p {
      margin: 5px 0;
    }

    /* Responsive mobile */
    @media (max-width: 768px) {
      header { padding: 20px; }
      nav { display: none; } /* Su smartphone puoi pensare poi di fare un menu a tendina */
      .hero h1 { font-size: 36px; }
      .section { padding: 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <a href="home.html">
      <img src="logo3.jpg" alt="StitchVale Logo">
    </a>
  </div>

  <nav>
    <a href="novita.html">Novità</a>
    <a href="brand.html">Brand</a>
    <a href="account.html">Account</a>
    <a href="catalogo.html">Catalogo</a>
    <a href="idee.html">Idee</a>
    <a href="outfit.html">AI Outfit</a>
  </nav>
</header>

<section class="hero">
  <h1>AI Outfit Finder</h1>
  <p>Immagina il tuo look ideale. Scrivilo qui sotto e la nostra intelligenza artificiale selezionerà i capi adatti a te.</p>

  <div class="ai-box">
    <textarea id="outfitPrompt" placeholder="Es: voglio un completo streetwear oversize total black, felpa pesante e pantaloni cargo..."></textarea>
    <div class="ai-box-footer">
      <button id="btnGenerate" class="btn-generate" onclick="generateOutfit()">Genera Look</button>
    </div>
  </div>

  <p id="resultText"></p>
</section>

<section class="section">
  <h2>Capi Selezionati per Te</h2>
  <div id="outfitResults" class="grid"></div>
</section>

<footer>
  <h3>StitchVale</h3>
  <p>Email: stitchvale1@gmail.com</p>
  <p>Instagram: @stitchvale</p>
</footer>

<script>
  const API_URL = "https://stitchvale-api.onrender.com";
  let currentResults = [];

  async function generateOutfit() {
    const prompt = document.getElementById("outfitPrompt").value.toLowerCase();
    const btn = document.getElementById("btnGenerate");

    if (!prompt) {
      alert("Descrivi lo stile o i vestiti che stai cercando.");
      return;
    }

    // Effetto feedback sul pulsante durante l'attesa
    btn.innerText = "Cercando...";
    btn.disabled = true;
    btn.style.opacity = "0.6";

    try {
      const res = await fetch(API_URL + "/products");
      const products = await res.json();

      const words = prompt
        .split(" ")
        .filter(word => word.length > 2);

      const scored = products.map(product => {
        const text = (
          product.name + " " +
          product.brand + " " +
          product.category + " " +
          (product.description || "")
        ).toLowerCase();

        let score = 0;

        words.forEach(word => {
          if (text.includes(word)) {
            score++;
          }
        });

        return { product, score };
      });

      let results = scored
        .filter(item => item.score > 0)
        .sort((a, b) => b.score - a.score)
        .map(item => item.product);

      if (results.length === 0) {
        document.getElementById("resultText").innerText =
          "Nessun capo corrisponde esattamente a questi termini. Prova a usare parole chiave più semplici (es: felpa, nero, cargo).";
        document.getElementById("outfitResults").innerHTML = "";
        return;
      }

      currentResults = results.slice(0, 6);

      document.getElementById("resultText").innerText =
        "Abbiamo selezionato " + currentResults.length + " capi in linea con la tua richiesta.";

      document.getElementById("outfitResults").innerHTML = currentResults.map((p, index) => `
        <div class="card">
          <div class="image-container">
            ${p.image ? `<img src="${API_URL}/uploads/${p.image}" alt="${p.name}">` : `<div style="padding:40px; color:#444;">Nessuna immagine</div>`}
          </div>

          <div class="card-info">
            <span class="brand-name">${p.brand}</span>
            <h3>${p.name}</h3>
            <p class="description">${p.description || "Nessuna descrizione disponibile per questo capo."}</p>
            
            <div class="card-footer">
              <span class="price">€${p.price}</span>
              <button class="btn-cart" onclick="addByIndexToCart(${index})">Aggiungi</button>
            </div>
          </div>
        </div>
      `).join("");

    } catch (err) {
      console.error(err);
      alert("C'è stato un problema di comunicazione con il server.");
    } finally {
      // Ripristina il pulsante originale
      btn.innerText = "Genera Look";
      btn.disabled = false;
      btn.style.opacity = "1";
    }
  }

  function getCart() {
    return JSON.parse(localStorage.getItem("cart")) || [];
  }

  function saveCart(cart) {
    localStorage.setItem("cart", JSON.stringify(cart));
  }

  function addByIndexToCart(index) {
    const product = currentResults[index];
    if (!product) return;

    const cart = getCart();
    const existing = cart.find(item => item.id === product.id);

    if (existing) {
      existing.quantity++;
    } else {
      cart.push({...product, quantity: 1});
    }

    saveCart(cart);
    alert(`${product.name} aggiunto al carrello!`);
  }
</script>
</body>
</html>
