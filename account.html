<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account — StitchVale</title>

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #0a0a0a;
      --input-bg: #111111;
      --accent-color: #ffffff;
      --text-main: #ffffff;
      --text-muted: #555555;
      --border-color: #151515;
      --focus-border: #333333;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 40px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo img {
      height: 40px;
      filter: grayscale(1) brightness(1.5);
    }

    nav {
      display: flex;
      gap: 32px;
    }

    nav a {
      color: #888888;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    nav a:hover {
      color: var(--text-main);
    }

    /* WRAPPER */
    .wrapper {
      max-width: 450px;
      margin: 80px auto;
      padding: 0 25px;
    }

    .header-title {
      text-align: left;
      margin-bottom: 40px;
    }

    .header-title h1 {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      margin: 0 0 10px 0;
      background: linear-gradient(180deg, #fff 0%, #555 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-title p {
      color: #888;
      font-size: 14px;
      margin: 0;
    }

    /* FORM BOX */
    .form-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 40px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 25px;
    }

    label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 800;
    }

    /* SELETTORE RUOLO */
    .role-selection {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border-color);
      border: 1px solid var(--border-color);
      margin-bottom: 10px;
    }

    .role-btn {
      background: var(--input-bg);
      color: #555;
      border: none;
      padding: 15px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .role-btn.active {
      background: var(--accent-color);
      color: #000;
    }

    input[type="text"], 
    input[type="email"], 
    input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 0px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--focus-border);
    }

    /* SUBMIT */
    .btn-submit {
      width: 100%;
      background: var(--accent-color);
      color: #000000;
      border: 1px solid var(--accent-color);
      padding: 16px;
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: transparent;
      color: var(--text-main);
    }

    .switch-mode {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #555;
    }

    .switch-mode a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
      text-transform: uppercase;
      margin-left: 5px;
    }

    /* MOBILE */
    @media (max-width: 640px) {
      header { padding: 20px; flex-direction: column; align-items: flex-start; gap: 20px; }
      nav { width: 100%; overflow-x: auto; white-space: nowrap; gap: 20px; padding-bottom: 5px; }
      nav::-webkit-scrollbar { display: none; }
      .wrapper { margin: 40px auto; }
      .form-box { padding: 30px 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <a href="home.html"><img src="logo3.jpg" alt="StitchVale Logo"></a>
  </div>
  <nav>
    <a href="novita.html">Novità</a>
    <a href="catalogo.html">Catalogo</a>
    <a href="brand.html">Brand</a>
    <a href="idee.html">Idee</a>
    <a href="outfit.html">AI Outfit</a>
    <a href="account.html">Account</a>
  </nav>
</header>

<div class="wrapper">
  <div class="header-title">
    <h1 id="mainTitle">Join the culture</h1>
    <p id="mainDesc">Crea il tuo profilo per accedere all'hub di StitchVale.</p>
  </div>

  <div class="form-box">
    <form id="authForm" onsubmit="handleAuth(event)">
      
      <div class="form-group" id="roleGroup">
        <label>Sei un Brand o un Creativo?</label>
        <div class="role-selection">
          <button type="button" class="role-btn active" id="btnUser" onclick="setRole('user')">Utente</button>
          <button type="button" class="role-btn" id="btnBrand" onclick="setRole('brand')">Brand</button>
        </div>
      </div>

      <div class="form-group" id="usernameGroup">
        <label for="regUsername">Username</label>
        <input type="text" id="regUsername" placeholder="Es: valestitch_99" required>
      </div>

      <div class="form-group">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" placeholder="Es: nome@esempio.com" required>
      </div>

      <div class="form-group">
        <label for="regPass">Password</label>
        <input type="password" id="regPass" placeholder="••••••••" required>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Registrati</button>

      <div class="switch-mode" id="toggleText">
        Hai già un account? <a href="#" onclick="toggleMode(event)">Accedi</a>
      </div>
    </form>
  </div>
</div>

<script>
  let isRegister = true;
  let currentRole = 'user';

  function setRole(role) {
    currentRole = role;
    document.getElementById('btnUser').classList.toggle('active', role === 'user');
    document.getElementById('btnBrand').classList.toggle('active', role === 'brand');
  }

  function toggleMode(e) {
    e.preventDefault();
    isRegister = !isRegister;
    
    const title = document.getElementById('mainTitle');
    const desc = document.getElementById('mainDesc');
    const roleGroup = document.getElementById('roleGroup');
    const usernameGroup = document.getElementById('usernameGroup');
    const submitBtn = document.getElementById('submitBtn');
    const toggleText = document.getElementById('toggleText');

    if (isRegister) {
      title.innerText = "Join the culture";
      desc.innerText = "Crea il tuo profilo per accedere all'hub di StitchVale.";
      roleGroup.style.display = "flex";
      usernameGroup.style.display = "flex";
      // Rimette l'obbligatorietà in modalità registrazione
      document.getElementById('regUsername').required = true;
      submitBtn.innerText = "Registrati";
      toggleText.innerHTML = 'Hai già un account? <a href="#" onclick="toggleMode(event)">Accedi</a>';
    } else {
      title.innerText = "Welcome back";
      desc.innerText = "Bentornato. Inserisci le tue credenziali.";
      roleGroup.style.display = "none";
      usernameGroup.style.display = "none";
      // Toglie l'obbligatorietà dello username in modalità login
      document.getElementById('regUsername').required = false;
      submitBtn.innerText = "Accedi";
      toggleText.innerHTML = 'Nuovo su StitchVale? <a href="#" onclick="toggleMode(event)">Registrati</a>';
    }
  }

  /* === QUESTA È LA PARTE COLLEGATA AL TUO SERVER SU RENDER === */
  async function handleAuth(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');

    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPass').value;
    const username = document.getElementById('regUsername').value;

    const payload = {
      email,
      password,
      role: isRegister ? currentRole : null,
      username: isRegister ? username : null
    };

    btn.innerText = isRegister ? "Registrazione..." : "Accesso in corso...";
    btn.disabled = true;
    btn.style.opacity = "0.7";

    try {
      const endpoint = isRegister ? "/register" : "/login";
      
      const res = await fetch("https://stitchvale-api.onrender.com" + endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (res.ok) {
        if (!isRegister && data.token) {
          localStorage.setItem("token", data.token);
        }
        alert(isRegister ? "Account creato con successo!" : "Accesso eseguito!");
        window.location.href = "home.html";
      } else {
        alert("Errore: " + (data.message || "Impossibile completare l'operazione."));
      }
    } catch (err) {
      console.error(err);
      alert("Errore di connessione con il server.");
    } finally {
      btn.innerText = isRegister ? "Registrati" : "Accedi";
      btn.disabled = false;
      btn.style.opacity = "1";
    }
  }
</script>
</body>
</html>
