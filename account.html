<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account — StitchVale</title>

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #0a0a0a;
      --input-bg: #111111;
      --accent-color: #ffffff;
      --text-main: #ffffff;
      --text-muted: #555555;
      --border-color: #151515;
      --focus-border: #333333;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 40px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo img {
      height: 40px;
      filter: grayscale(1) brightness(1.5);
    }

    nav {
      display: flex;
      gap: 32px;
    }

    nav a {
      color: #888888;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: color 0.3s, transform 0.2s;
    }

    nav a:hover {
      color: var(--text-main);
    }

    /* WRAPPER & CONTAINER */
    .wrapper {
      max-width: 500px;
      margin: 100px auto;
      padding: 0 25px;
    }

    .header-title {
      text-align: left;
      margin-bottom: 45px;
    }

    .header-title h1 {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      margin: 0 0 10px 0;
      background: linear-gradient(180deg, #fff 0%, #555 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-title p {
      color: #888;
      font-size: 15px;
      margin: 0;
    }

    /* FORM BOX BRUTALISTA */
    .form-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 40px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 25px;
    }

    label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 700;
    }

    input[type="text"], 
    input[type="email"], 
    input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 0px; /* Taglio netto coerente con la home */
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus {
      border-color: var(--focus-border);
    }

    /* BOTTONI ACCESSO / REGISTRAZIONE */
    .btn-submit {
      width: 100%;
      background: var(--accent-color);
      color: #000000;
      border: 1px solid var(--accent-color);
      padding: 16px;
      border-radius: 0px;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: transparent;
      color: var(--text-main);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .switch-mode {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: #666;
    }

    .switch-mode a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
    }

    .switch-mode a:hover {
      text-decoration: underline;
    }

    /* RESPONSIVE */
    @media (max-width: 640px) {
      header {
        padding: 20px;
        flex-direction: column;
        gap: 20px;
        align-items: flex-start;
      }

      nav {
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
        padding-bottom: 5px;
        gap: 20px;
      }
      
      nav::-webkit-scrollbar {
        display: none;
      }

      nav a {
        font-size: 12px;
        display: inline-block;
      }

      .wrapper {
        margin: 50px auto;
      }

      .form-box {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <a href="home.html">
      <img src="logo3.jpg" alt="StitchVale Logo">
    </a>
  </div>

  <nav>
    <a href="novita.html">Novità</a>
    <a href="catalogo.html">Catalogo</a>
    <a href="brand.html">Brand</a>
    <a href="idee.html">Idee</a>
    <a href="outfit.html">AI Outfit</a>
    <a href="account.html">Account</a>
  </nav>
</header>

<div class="wrapper">
  
  <div class="header-title">
    <h1 id="pageTitle">Join us</h1>
    <p id="pageSubtitle">Crea il tuo profilo StitchVale per accedere all'hub.</p>
  </div>

  <div class="form-box">
    <form id="accountForm" onsubmit="handleAuth(event)">
      
      <div class="form-group" id="usernameGroup">
        <label for="userUsername">Username</label>
        <input type="text" id="userUsername" placeholder="Es: stitch_creator" required>
      </div>

      <div class="form-group">
        <label for="userEmail">Email</label>
        <input type="email" id="userEmail" placeholder="Es: nome@esempio.com" required>
      </div>

      <div class="form-group">
        <label for="userPassword">Password</label>
        <input type="password" id="userPassword" placeholder="••••••••" required>
      </div>

      <button type="submit" id="btnAuth" class="btn-submit">Registrati</button>

      <div class="switch-mode" id="switchContainer">
        Hai già un account? <a href="#" onclick="toggleMode(event)">Accedi ora</a>
      </div>

    </form>
  </div>

</div>

<script>
  // Stato iniziale della pagina: "register" o "login"
  let isRegisterMode = true;

  function toggleMode(e) {
    e.preventDefault();
    isRegisterMode = !isRegisterMode;

    const pageTitle = document.getElementById("pageTitle");
    const pageSubtitle = document.getElementById("pageSubtitle");
    const usernameGroup = document.getElementById("usernameGroup");
    const usernameInput = document.getElementById("userUsername");
    const btnAuth = document.getElementById("btnAuth");
    const switchContainer = document.getElementById("switchContainer");

    if (isRegisterMode) {
      pageTitle.innerText = "Join us";
      pageSubtitle.innerText = "Crea il tuo profilo StitchVale per accedere all'hub.";
      usernameGroup.style.display = "flex";
      usernameInput.required = true;
      btnAuth.innerText = "Registrati";
      switchContainer.innerHTML = 'Hai già un account? <a href="#" onclick="toggleMode(event)">Accedi ora</a>';
    } else {
      pageTitle.innerText = "Welcome back";
      pageSubtitle.innerText = "Inserisci le tue credenziali per entrare nel tuo spazio.";
      usernameGroup.style.display = "none";
      usernameInput.required = false; // Non serve per il login
      btnAuth.innerText = "Accedi";
      switchContainer.innerHTML = 'Nuovo su StitchVale? <a href="#" onclick="toggleMode(event)">Crea un account</a>';
    }
  }

  async function handleAuth(event) {
    event.preventDefault();
    const btn = document.getElementById("btnAuth");

    const email = document.getElementById("userEmail").value;
    const password = document.getElementById("userPassword").value;
    
    // Raccoglie lo username solo se siamo in modalità registrazione
    let username = null;
    if (isRegisterMode) {
      username = document.getElementById("userUsername").value;
    }

    btn.innerText = isRegisterMode ? "Registrazione..." : "Accesso in corso...";
    btn.disabled = true;
    btn.style.opacity = "0.7";

    // Qui andrai a inserire la chiamata alle tue API collegate a Supabase
    // Esempio logico di trasmissione dati:
    try {
      const endpoint = isRegisterMode ? "/api/register" : "/api/login";
      
      const payload = { email, password };
      if (isRegisterMode) {
        payload.username = username; // Passa l'username estratto alla tabella Supabase
      }

      console.log("Inviando dati a Supabase:", payload);
      
      // Simulazione risposta positiva per non bloccare i test locali
      setTimeout(() => {
        alert(isRegisterMode ? "Registrazione completata!" : "Accesso eseguito!");
        btn.innerText = isRegisterMode ? "Registrati" : "Accedi";
        btn.disabled = false;
        btn.style.opacity = "1";
      }, 1000);

    } catch (err) {
      console.error(err);
      alert("Errore di connessione durante l'autenticazione.");
      btn.disabled = false;
      btn.style.opacity = "1";
    }
  }
</script>
</body>
</html>
