<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand - StitchVale</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 35px;
      background: black;
      border-bottom: 1px solid #222;
    }

    .logo img {
      height: 80px;
    }

    nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
    }

    nav a:hover {
      color: white;
    }

    .hero {
      text-align: center;
      padding: 50px 20px;
    }

    /* Struttura a griglia con linea di separazione */
    .forms-container {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 40px;
      max-width: 1100px;
      margin: auto;
      padding: 0 20px;
      align-items: start;
    }

    /* Linea verticale divisoria */
    .divider {
      width: 1px;
      background: linear-gradient(to bottom, transparent, #333, transparent);
      height: 100%;
      min-height: 400px;
    }

    .box {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 15px;
      border: 1px solid #222;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #aaa;
    }

    input, textarea, select, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #252525;
      color: white;
      box-sizing: border-box;
    }

    input:focus, textarea:focus, select:focus {
      outline: 1px solid white;
    }

    input[type="file"] {
      background: transparent;
      border: none;
      padding: 5px 0;
    }

    button {
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    button:hover {
      background: #e0e0e0;
    }

    /* Stile per i messaggi di stato */
    .status-message {
      text-align: center;
      font-weight: bold;
      margin-top: -10px;
      margin-bottom: 15px;
      font-size: 14px;
    }
    
    .success {
      color: #4cd137;
    }

    .warning {
      text-align: center;
      margin: 30px;
      color: orange;
    }

    /* Responsive per Tablet e Smartphone */
    @media(max-width: 900px){
      .forms-container {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      /* La linea da verticale diventa orizzontale */
      .divider {
        width: 100%;
        height: 1px;
        min-height: auto;
        background: linear-gradient(to right, transparent, #333, transparent);
        margin: 20px 0;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <a href="home.html"><img src="logo3.jpg" alt="Logo"></a>
    </div>
    <nav>
      <a href="catalogo.html">Catalogo</a>
      <a href="idee.html">Idee</a>
      <a href="account.html">Account</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Area Brand</h1>
    <p>Gestisci il tuo brand e carica prodotti</p>
  </section>

  <div id="accessMessage" class="warning"></div>

  <div id="content" style="display:none;">
    <div class="forms-container">

      <div class="box">
        <h2>Profilo Brand</h2>
        
        <label for="brandName">Nome del Brand</label>
        <input id="brandName" placeholder="Es. StitchVale Studio">

        <label for="brandBio">Biografia / Descrizione</label>
        <textarea id="brandBio" placeholder="Racconta la storia del tuo brand..."></textarea>

        <label for="brandStyle">Stile Principale</label>
        <select id="brandStyle">
          <option value="">Seleziona lo stile</option>
          <option value="streetwear">Streetwear</option>
          <option value="casual">Casual</option>
          <option value="elegante">Elegante</option>
          <option value="vintage">Vintage</option>
          <option value="sportswear">Sportswear</option>
        </select>

        <label for="brandWebsite">Sito Web (Opzionale)</label>
        <input id="brandWebsite" type="url" placeholder="https://tuosito.com">

        <label for="brandInstagram">Instagram Username (Opzionale)</label>
        <input id="brandInstagram" placeholder="@tuobrand">

        <label for="brandLogo">Logo del Brand</label>
        <input type="file" id="brandLogo">

        <button onclick="saveBrand()">Salva profilo</button>
        <div id="status" class="status-message"></div>
      </div>

      <div class="divider"></div>

      <div class="box">
        <h2>Carica prodotto</h2>

        <label for="name">Nome prodotto</label>
        <input id="name" placeholder="Es. Felpa Oversize Hoodie">

        <label for="category">Categoria</label>
        <select id="category">
          <option value="">Seleziona categoria</option>
          <option value="felpa">Felpa</option>
          <option value="tshirt">T-shirt</option>
          <option value="pantaloni">Pantaloni</option>
          <option value="giacca">Giacca</option>
          <option value="scarpe">Scarpe</option>
          <option value="accessori">Accessori</option>
        </select>

        <label for="description">Descrizione prodotto</label>
        <textarea id="description" placeholder="Materiali, vestibilità, dettagli..."></textarea>

        <label for="price">Prezzo (€)</label>
        <input id="price" placeholder="Es. 49.99">

        <label for="images">Immagini del prodotto</label>
        <input type="file" id="images" multiple>

        <button onclick="uploadProduct()">Carica prodotto</button>
      </div>

    </div>
  </div>

  <script>
    const API_URL = "https://stitchvale-api.onrender.com";

    function getToken() {
      return localStorage.getItem("token");
    }

    box_role = () => localStorage.getItem("role");

    function checkAccess() {
      if (!getToken()) {
        document.getElementById("accessMessage").innerText = "Devi fare login";
        return;
      }

      if (localStorage.getItem("role") !== "brand") {
        document.getElementById("accessMessage").innerText = "Solo account brand";
        return;
      }

      document.getElementById("content").style.display = "block";
    }

    /* SALVA BRAND */
    async function saveBrand() {
      const formData = new FormData();

      formData.append("name", document.getElementById("brandName").value);
      formData.append("bio", document.getElementById("brandBio").value);
      
      // Invio dei nuovi campi all'API
      formData.append("style", document.getElementById("brandStyle").value);
      formData.append("website", document.getElementById("brandWebsite").value);
      formData.append("instagram", document.getElementById("brandInstagram").value);

      const file = document.getElementById("brandLogo").files[0];
      if (file) formData.append("logo", file);

      try {
        const res = await fetch(API_URL + "/brands", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + getToken()
          },
          body: formData
        });

        const data = await res.json();
        
        // Gestione feedback visivo "Profilo Aggiornato"
        const statusDiv = document.getElementById("status");
        statusDiv.className = "status-message success";
        statusDiv.innerText = "✓ Profilo aggiornato con successo!";
        
        // Il messaggio scompare dopo 3 secondi
        setTimeout(() => {
          statusDiv.innerText = "";
        }, 3000);

      } catch (error) {
        const statusDiv = document.getElementById("status");
        statusDiv.style.color = "red";
        statusDiv.innerText = "Errore durante il salvataggio.";
      }
    }

    /* CARICA PRODOTTI */
    async function uploadProduct() {
      const formData = new FormData();

      formData.append("name", document.getElementById("name").value);
      formData.append("category", document.getElementById("category").value);
      formData.append("description", document.getElementById("description").value);
      formData.append("price", document.getElementById("price").value);

      const files = document.getElementById("images").files;
      for (let i = 0; i < files.length; i++) {
        formData.append("images", files[i]);
      }

      const res = await fetch(API_URL + "/products", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + getToken()
        },
          body: formData
      });

      const data = await res.json();
      alert(data.message);
    }

    window.onload = checkAccess;
  </script>
</body>
</html>
